name: UI wording / translation suggestion
description: Suggest a UI wording improvement or translation-related change for an Adiscon Windows product.
title: "[UI] "
labels:
  - type:ui-wording
  - status:needs-triage
body:
  - type: dropdown
    id: product
    attributes:
      label: Product
      description: Select the product this suggestion applies to.
      options:
        - WinSyslog
        - EventReporter
        - MonitorWare Agent
        - rsyslog Windows Agent
    validations:
      required: true

  - type: dropdown
    id: suggestion_type
    attributes:
      label: Suggestion type
      options:
        - UI wording
        - Translation improvement
        - Both
    validations:
      required: true

  - type: input
    id: language_file
    attributes:
      label: Language file
      description: Name the relevant language file if known.
      placeholder: example-file-name
    validations:
      required: false

  - type: textarea
    id: current_text
    attributes:
      label: Current text
      description: Provide the current wording if available.
      placeholder: Paste the current text or explain where it appears.
    validations:
      required: false

  - type: textarea
    id: proposed_text
    attributes:
      label: Proposed text or change
      description: Describe the improved wording or translation.
      placeholder: Current text -> proposed text
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: Explain why this wording or translation should be changed.
      placeholder: Clarify confusion, improve consistency, localize better, or improve usability.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, usage context, or formatting notes if helpful.
      placeholder: Optional extra context
    validations:
      required: false
